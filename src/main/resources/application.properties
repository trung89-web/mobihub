spring.application.name=mobihub

# MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_ban_dien_thoai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.admin.email=${MOBIHUB_ADMIN_EMAIL:admin@mobihub.local}
app.admin.password=${MOBIHUB_ADMIN_PASSWORD:Mobihub@123}
app.payment.bank-id=${MOBIHUB_BANK_ID:}
app.payment.account-no=${MOBIHUB_BANK_ACCOUNT:}
app.payment.account-name=${MOBIHUB_BANK_NAME:}